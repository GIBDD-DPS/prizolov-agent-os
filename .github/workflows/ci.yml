# Проверка при каждом push и pull request: стиль кода (ruff), заголовки
# авторства во всех файлах и тесты на Python 3.10-3.13. Сеть и ключ Claude
# тестам не нужны: модель, котировки и Telegram имитируются.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff и заголовки авторства
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Установить ruff
        run: pip install "ruff>=0.5"
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Заголовки авторства
        run: python scripts/stamp_headers.py --check

  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Тесты не должны зависеть от ключа и писать журналы в папку проекта.
      ANTHROPIC_API_KEY: ""
      PRIZOLOV_TRACE: "false"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Установить пакет
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,telegram,api]"
      - name: Pytest
        run: python -m pytest -q -p no:cacheprovider

  docker:
    name: Docker-образ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Собрать образ
        run: docker build -t prizolov-os:ci .
      - name: Запустить и проверить веб-интерфейс и API
        run: |
          docker run -d --name pzl -p 8800:8800 \
            -e PRIZOLOV_API_KEYS=ci-check-key-0123456789 prizolov-os:ci
          for i in $(seq 1 30); do curl -sf localhost:8800/health && break; sleep 1; done
          curl -sf localhost:8800/ | grep -q "Prizolov Agent OS"
          curl -sf -H "X-API-Key: ci-check-key-0123456789" localhost:8800/v1/schedules | grep -q verify
          docker exec pzl prizolov doctor --offline
          docker logs pzl
