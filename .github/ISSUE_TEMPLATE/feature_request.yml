name: Идея
description: Новая возможность, источник данных или инструмент для агентов
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решит
      description: Опишите ситуацию, в которой не хватает этой возможности.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Как это могло бы работать
  - type: textarea
    id: alternatives
    attributes:
      label: Как вы решаете задачу сейчас
