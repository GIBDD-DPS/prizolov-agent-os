version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Минимальные версии в pyproject.toml поднимаем, только когда новая версия
    # не попадает в диапазон: иначе у пользователей со старыми библиотеками
    # установка ломалась бы без причины.
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
