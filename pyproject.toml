# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prizolov-os"
dynamic = ["version"]
description = "Agentic AI Operating System for autonomous business orchestration"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Dm.Andreyanov", email = "contact@prizolov.ru" }
]
maintainers = [
    { name = "Dm.Andreyanov", email = "contact@prizolov.ru" }
]
keywords = ["ai", "agents", "rag", "orchestration", "sovereign-ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typing-extensions>=4.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=1.11.0",
    "rich>=13.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
telegram = [
    "python-telegram-bot>=21.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]
all = [
    "prizolov-os[dev]",
    "prizolov-os[rag]",
    "prizolov-os[api]",
    "prizolov-os[telegram]",
]

[project.scripts]
prizolov = "cli.main:main"

[project.urls]
Homepage = "https://github.com/GIBDD-DPS/prizolov-agent-os"
Documentation = "https://prizolov-os.readthedocs.io"
Repository = "https://github.com/GIBDD-DPS/prizolov-agent-os"
Issues = "https://github.com/GIBDD-DPS/prizolov-agent-os/issues"
Brand = "https://prizolov.ru"

[tool.setuptools.dynamic]
version = { attr = "prizolov_os.__about__.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["prizolov_os*", "cli*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["S101", "ANN"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
